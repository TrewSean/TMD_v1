# Series catalogue. The single source of truth for "what numbers exist".
#
# Rules
#  * id is permanent. Never rename; deactivate (active: false) and add a new one.
#  * id format: <country>.<publisher_or_market>.<thing>[.<tenor>]  all lower snake.
#  * source must match a SourceAdapter.name in tmd/sources.
#  * source_ref is whatever that adapter needs to find the value (ticker, column).
#  * tier is about the SOURCE (primary publisher / licensed feed / aggregator),
#    not about how much you like the number.
#
# The `defaults` block is merged into every entry that omits a key.

defaults:
  active: true
  description: ""
  tags: []

series:

