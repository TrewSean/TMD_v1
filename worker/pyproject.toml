[project]
name = "tmd-worker"
version = "0.1.0"
description = "Always-on streaming worker: Alpaca websocket bars -> Postgres"
requires-python = ">=3.11"
dependencies = [
    "tmd",            # the ingest package (installed from ../ingest)
    "alpaca-py>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tmd-worker = "tmd_worker.stream:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tmd_worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
