# Fly.io config for the streaming worker (worker/). Lives at the REPO ROOT because Fly
# uses the config file's directory as the build context and worker/Dockerfile needs to
# COPY both ingest/ and worker/. Deploy from the repo root:
#   fly launch --no-deploy --copy-config --name tmd-worker --region syd   (first time)
#   fly secrets set DATABASE_URL=... ALPACA_API_KEY=... ALPACA_API_SECRET=... ALPACA_FEED=iex
#   fly deploy
app = "tmd-worker"
primary_region = "syd"

[build]
  dockerfile = "worker/Dockerfile"

[processes]
  worker = "tmd-worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]

# No [http_service]: this is a background process, not a web server.
# Fly keeps one machine running; auto-stop is off by default for non-http processes.
